<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b5fff">
  <title>Immigration Hub</title>

  <!-- iOS install / PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Immigration Hub">
  <!-- Hosted touch-icon so you don’t have to upload images -->
  <link rel="apple-touch-icon" href="https://fav.farm/🛂">
  <link rel="icon" href="https://fav.farm/🛂">

  <style>
    /* Keep your existing light theme styles here. Minor mobile polish below. */
    :root{ --safe:env(safe-area-inset-bottom,0); }
    button, a.btn { -webkit-tap-highlight-color: rgba(0,0,0,0); }
    .tabs { position: sticky; top: 0; z-index: 5; background: #fff; padding-bottom: 8px; }
    .btn { min-height: 44px; }
    footer { padding-bottom: calc(var(--safe) + 16px); }
  </style>
</head>
<body>
  <!-- Keep your current header/hero/tabs and main content from the canvas build here -->
  <!-- If you prefer, paste the entire “Immigration Hub – Light Themed Single-File Build” content here. -->

  <!-- Service worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
